<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="backdrop" width="1080" height="1080" aria-hidden="true"></canvas>
<main class="studio">
  <aside class="panel">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">VC</div>
      <div>
        <h1>Vice Cover Studio</h1>
        <p>Forge your own Vice City cover art</p>
      </div>
    </header>

    <div class="fields">
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" maxlength="18" value="GTA VI" autocomplete="off">
      </label>
      <label class="field">
        <span>Subtitle</span>
        <input id="subtitle" type="text" maxlength="26" value="VICE CITY" autocomplete="off">
      </label>
      <label class="field field-wide">
        <span>Tagline</span>
        <input id="tagline" type="text" maxlength="44" value="Welcome back to Vice City" autocomplete="off">
      </label>
    </div>

    <div class="field">
      <span>Theme</span>
      <div class="swatches" id="themes" role="radiogroup" aria-label="Theme">
        <button type="button" class="swatch is-on" data-theme="sunset" role="radio" aria-checked="true"><i class="dot dot-sunset"></i>Vice Sunset</button>
        <button type="button" class="swatch" data-theme="neon" role="radio" aria-checked="false"><i class="dot dot-neon"></i>Neon Nights</button>
        <button type="button" class="swatch" data-theme="golden" role="radio" aria-checked="false"><i class="dot dot-golden"></i>Golden Hour</button>
        <button type="button" class="swatch" data-theme="midnight" role="radio" aria-checked="false"><i class="dot dot-midnight"></i>Midnight Vice</button>
      </div>
    </div>

    <div class="field">
      <span>Layout</span>
      <div class="segmented" id="layouts" role="radiogroup" aria-label="Layout">
        <button type="button" class="seg is-on" data-layout="classic" role="radio" aria-checked="true">Classic</button>
        <button type="button" class="seg" data-layout="poster" role="radio" aria-checked="false">Poster</button>
        <button type="button" class="seg" data-layout="billboard" role="radio" aria-checked="false">Billboard</button>
      </div>
    </div>

    <div class="field">
      <span>Backdrop</span>
      <div class="segmented" id="backdrops" role="radiogroup" aria-label="Backdrop">
        <button type="button" class="seg is-on" data-backdrop="scene" role="radio" aria-checked="true">Painted</button>
        <button type="button" class="seg" data-backdrop="boulevard" role="radio" aria-checked="false">Boulevard</button>
        <button type="button" class="seg" data-backdrop="pier" role="radio" aria-checked="false">Pier</button>
      </div>
    </div>

    <div class="row">
      <label class="check">
        <input id="stars" type="checkbox" checked>
        <span>Wanted stars</span>
      </label>
      <label class="check">
        <input id="badge" type="checkbox" checked>
        <span>Rating badge</span>
      </label>
    </div>

    <label class="field">
      <span>Film grain <output id="grain-out">35%</output></span>
      <input id="grain" type="range" min="0" max="100" value="35">
    </label>

    <button id="export" class="export" type="button">Export PNG · 1080 × 1080</button>
    <p id="status" class="status" role="status"></p>
  </aside>

  <section class="stage">
    <div class="frame">
      <canvas id="cover" width="1080" height="1080" aria-label="Your cover art"></canvas>
    </div>
    <p class="stage-note">Live preview · every control repaints instantly · 100% offline, drawn in code</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
